<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agnes — compositor por capas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--panel:#16171a;--panel2:#1d1e22;--line:#2a2c31;--txt:#e7e7e9;--mute:#8b8e96;--acc:#f0a53a;--blue:#5aa9ff;--src:#3fbfa6;--flt:#5aa9ff;--attr:#f0a53a;--mix:#b18cff;--code:#ff7a8a;--fx:#9be15d;--wire:#7f8bb8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.35 Inter,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow-x:auto;flex:none}
.brand{font-weight:600;letter-spacing:.02em;margin-right:4px}.brand span{color:var(--mute);font-weight:400;margin-left:6px;font-size:12px}
button,select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:7px;height:30px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
button:hover,select:hover{border-color:#3d4047}
button svg{width:15px;height:15px;flex:none}
.icon{padding:0;width:30px;justify-content:center}
#time{font:12px 'JetBrains Mono',monospace;color:var(--mute);min-width:58px;cursor:pointer}
.spacer{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"viewer params" "graph params"}
#viewer{grid-area:viewer;position:relative;background:#0a0a0b;border-bottom:1px solid var(--line);min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#vinfo{position:absolute;left:10px;bottom:8px;font:11px 'JetBrains Mono',monospace;color:#a9acb3;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:5px;pointer-events:none}
#vch{position:absolute;right:8px;top:8px;height:26px;font-size:12px;background:rgba(20,20,22,.85)}
#graph{grid-area:graph;position:relative;overflow:hidden;touch-action:none;background-color:#121316;background-image:radial-gradient(#25272c 1px,transparent 1px);background-size:22px 22px;user-select:none;-webkit-user-select:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-width:2.2}
#wires path.sc{stroke:var(--attr)}
#wires path.mod{stroke:var(--fx);stroke-dasharray:3 5;stroke-width:1.8;opacity:.85}
#wires path.tmp{stroke:#fff;stroke-dasharray:6 4}
.node{position:absolute;width:156px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:grab}
.node.sel{border-color:#cfd2d8}
.node.disp{box-shadow:0 0 0 2px var(--blue),0 6px 18px rgba(0,0,0,.35)}
.nh{display:flex;align-items:center;gap:7px;padding:0 4px 0 10px;height:30px;border-bottom:1px solid var(--line)}
.cat{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.nt{flex:1;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{height:24px;width:26px;padding:0;justify-content:center;background:transparent;border:0;color:#5d6068}
.node.disp .eye{color:var(--blue)}
.nb{padding:4px 0}
.port.in{position:relative;height:24px;display:flex;align-items:center;padding-left:14px;font-size:11.5px;color:#c5c7cc}
.port.in i{position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#24262c;border:2px solid var(--wire);transition:transform .1s}
.port.in.sc i{border-radius:3px;border-color:var(--attr)}
.port.in.on i{background:var(--wire)}.port.in.sc.on i{background:var(--attr)}
.port.in b{margin-left:auto;margin-right:8px;font:500 10px 'JetBrains Mono',monospace;color:var(--attr)}
.port.out{position:absolute;right:-15px;top:1px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:crosshair}
.port.out i{width:13px;height:13px;border-radius:50%;background:#d4d7de;border:2px solid #16171a;box-shadow:0 0 0 1px #d4d7de}
.sub{padding:3px 10px 5px;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#graph.wiring .port.in i{transform:scale(1.3)}
.hint{position:absolute;left:10px;bottom:12px;font-size:11px;color:#5a5e66;pointer-events:none}
.fab{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:4}
.fab button{height:36px;background:#1f2126}
.fab .add{background:var(--acc);color:#1a1205;border-color:transparent;font-weight:600}
#menu{position:absolute;right:10px;bottom:54px;width:250px;max-height:calc(100% - 64px);overflow:auto;background:#1b1c20;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
#menu[hidden]{display:none}
#menu h6{margin:8px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
#menu button{width:100%;border:0;background:transparent;justify-content:flex-start;height:32px;gap:9px}
#menu button:hover{background:#26282e}
#menu small{margin-left:auto;color:var(--mute);font-size:11px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#2a1416;color:#ffb3bb;border:1px solid #5a2228;padding:6px 12px;border-radius:8px;font-size:12px;z-index:6;pointer-events:none}
#params{grid-area:params;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.ph{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);z-index:1}
.ph .t{flex:1;font-weight:600}
.ph button{height:28px}.ph .icon{width:28px}
.mob{display:none!important}
.pb{padding:4px 12px 18px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 0 6px;font-weight:600}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 56px;align-items:center;gap:8px;min-height:32px}
.row.wide{grid-template-columns:92px minmax(0,1fr)}
.row.m{grid-template-columns:92px minmax(0,1fr) 56px 28px}
.modbtn{width:28px;height:26px;padding:0;justify-content:center;background:transparent;border-color:transparent;color:#5d6068}
.modbtn:hover{color:var(--fx)}.modbtn.on{color:#0e1408;background:var(--fx);border-color:var(--fx)}
.modrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;align-items:center;margin:2px 0 8px 0;padding:8px;border:1px solid #2f3a26;border-radius:8px;background:#151a12}
.modrow select{height:28px;width:100%;font-size:12px}
.modrow .amt{grid-column:1/3;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#b9c7ad}
.modrow .amt input{flex:1;accent-color:var(--fx)}
.modrow .amt output{font:11px 'JetBrains Mono',monospace;width:44px;text-align:right}
.modrow .meter{grid-column:1/4;height:4px;background:#26301e;border-radius:2px;overflow:hidden}
.modrow .meter i{display:block;height:100%;width:0;background:var(--fx)}
.modrow button{width:28px;height:28px;padding:0;justify-content:center}
.row label{color:#c5c7cc;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.row input[type=range]{width:100%;accent-color:var(--acc);margin:0}
.row input[type=number]{width:56px;height:26px;background:#101114;border:1px solid var(--line);color:var(--txt);border-radius:6px;font:11px 'JetBrains Mono',monospace;padding:0 4px}
.row select{height:28px;width:100%}
.row input[type=color]{width:56px;height:28px;padding:0 2px;background:#101114;border:1px solid var(--line);border-radius:6px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.inrow{display:flex;align-items:center;gap:8px;min-height:34px}
.inrow label{width:92px;flex:none;color:#c5c7cc;font-size:12px}
.inrow .src{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inrow .src.none{color:var(--mute)}
.inrow select{height:28px;width:112px;flex:none;border-color:#5a4422}
.filepick{position:relative;overflow:hidden;flex:none}
.filepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}
#viewer.drop{outline:2px dashed var(--acc);outline-offset:-6px}
.fname{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea.code{width:100%;min-height:230px;background:#0c0d0f;color:#ece6d6;border:1px solid var(--line);border-radius:8px;font:12px/1.55 'JetBrains Mono',monospace;padding:10px;resize:vertical;tab-size:2;white-space:pre;overflow:auto;outline:none}
textarea.code:focus{border-color:#4a4d55}
.err{background:#2a1416;color:#ff9ea8;border:1px solid #5a2228;border-radius:7px;padding:8px;font:11px/1.45 'JetBrains Mono',monospace;white-space:pre-wrap;margin-top:8px}
.ok{color:#7fd6a8;font-size:11.5px;margin-top:6px}
details.ref{margin-top:12px;color:#b8bac0;font-size:12px}
details.ref summary{cursor:pointer;color:var(--txt)}
details.ref ul{padding-left:18px;margin:8px 0}
details.ref li{margin:4px 0}
code{font:11px 'JetBrains Mono',monospace;color:var(--acc)}
.empty{padding:14px 12px;color:var(--mute);line-height:1.55}
.empty b{color:var(--txt);font-weight:600}
.dotw{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d4d7de;vertical-align:-1px}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--attr);vertical-align:-1px}
.fatal{padding:30px;color:#ffb3bb}
#exp,#fxDlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
#exp[hidden],#fxDlg[hidden]{display:none}
#exp .sheet,#fxDlg .sheet{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#exp .note,#fxDlg .note{color:var(--mute);font-size:12px;margin-bottom:8px}
#exp .btns,#fxDlg .btns{display:flex;gap:8px}
#fxDlg .sheet{max-width:460px}
#fxDlg .btns>*{flex:1}
#fxDlg .filepick button{width:100%;height:38px;justify-content:center}
#fxDlg textarea.code{min-height:120px;margin-top:8px}
#fxPasteBtn{width:100%;height:38px;justify-content:center;margin-top:8px}
#fxMsg{font-size:12px;margin-top:8px;white-space:pre-wrap;line-height:1.45}
#fxMsg .bad{color:#ff9ea8}#fxMsg .good{color:#7fd6a8}
.fxitem{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.fxitem .info{flex:1;min-width:0}
.fxitem b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxitem small{display:block;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxitem .acts{display:flex;gap:4px;flex:none}
.fxitem .acts button{height:30px;padding:0 8px}
.fxitem .acts .icon{width:30px;padding:0}
.fxempty{color:var(--mute);font-size:12px;padding:8px 0}
.saverow{display:flex;gap:8px}
.saverow input{flex:1;min-width:0;height:30px;background:#101114;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:0 8px;font:inherit}
.fxbtns{display:flex;gap:8px;margin-top:10px}
.fxbtns button{flex:1;justify-content:center}
#menu .manage{color:var(--fx);justify-content:center;border-top:1px solid var(--line)!important;border-radius:0;margin-top:4px}
.toast.okt{background:#14261b;color:#9be6b9;border-color:#245a36}
#exp .btns button,#expRec{flex:1;height:38px;justify-content:center}
.primary{background:var(--acc)!important;color:#1a1205!important;border-color:transparent!important;font-weight:600}
#expRec{width:100%;margin-top:8px}
.prog{height:6px;background:#26282d;border-radius:3px;overflow:hidden;margin-top:10px}
.prog div{height:100%;width:0;background:var(--acc)}
#expMsg{font-size:12px;color:#c5c7cc;margin-top:8px;min-height:16px}
#expPrev img,#expPrev video{width:100%;border-radius:8px;margin-top:8px;background:#000;display:block}
#exportBtn{border-color:#5a4422}
@media (max-width:760px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:31vh minmax(0,1fr) auto;grid-template-areas:"viewer" "graph" "params"}
  #params{border-left:0;border-top:1px solid var(--line);max-height:42vh}
  #params.collapsed .pb,#params.collapsed .empty{display:none}
  #params.collapsed .mob svg{transform:rotate(180deg)}
  .mob{display:inline-flex!important}
  .brand span,.hint,#exportBtn span,#fxBtn span{display:none}
  #fxBtn{padding:0;width:34px;justify-content:center}
  #exportBtn{padding:0;width:34px;justify-content:center}
}
</style>
</head>
<body>
<header>
  <div class="brand">Agnes<span>compositor por capas</span></div>
  <button id="play" class="icon" title="Reproducir / pausar (espacio)"></button>
  <span id="time" title="Toca para volver a 0">0.00 s</span>
  <select id="res" title="Tamaño del lienzo"></select>
  <span class="spacer"></span>
  <button id="fxBtn" title="Mis efectos: importar y administrar"></button>
  <button id="exportBtn" title="Exportar foto o video"></button>
  <button id="reset" title="Restaurar el grafo de ejemplo"></button>
</header>
<main>
  <section id="viewer">
    <canvas id="gl"></canvas>
    <div id="vinfo"></div>
    <select id="vch" title="Canal en el visor">
      <option value="0">RGB</option><option value="1">R</option><option value="2">G</option><option value="3">B</option><option value="4">Alfa</option><option value="5">Luminancia</option>
    </select>
  </section>
  <section id="graph">
    <div id="world"><svg id="wires"></svg><div id="nodes"></div></div>
    <div class="hint">Arrastra desde ● hasta una entrada · rueda o pellizco para zoom</div>
    <div class="fab"><button id="fit" title="Encuadrar todo"></button><button id="add" class="add"></button></div>
    <div id="menu" hidden></div>
  </section>
  <aside id="params"></aside>
</main>

<div id="exp" hidden><div class="sheet">
  <div class="ph"><span class="t">Exportar</span><button class="icon" id="expClose" title="Cerrar"></button></div>
  <div class="pb">
    <div class="sec">Foto</div>
    <div class="note" id="expPhotoNote"></div>
    <div class="btns"><button data-photo="png">PNG</button><button data-photo="jpg">JPG</button></div>
    <div class="sec">Video</div>
    <div class="note" id="expVidNote"></div>
    <div class="row wide"><label>Duración</label><select id="expDur"></select></div>
    <div class="row wide"><label>Cuadros/s</label><select id="expFps"><option value="24">24</option><option value="30" selected>30</option><option value="60">60</option></select></div>
    <button id="expRec" class="primary">Grabar video</button>
    <div class="prog" hidden><div></div></div>
    <div id="expMsg"></div>
    <div id="expPrev"></div>
  </div>
</div></div>
<div id="fxDlg" hidden><div class="sheet">
  <div class="ph"><span class="t">Mis efectos</span><button class="icon" id="fxClose" title="Cerrar"></button></div>
  <div class="pb">
    <div class="sec">Importar</div>
    <div class="note">Archivos <code>.glsl</code>, <code>.txt</code> o <code>.json</code> con código del nodo Código. Se guardan solo en este navegador y aparecen en <b>+ Nodo → Mis efectos</b>.</div>
    <div class="btns"><span class="filepick"><button tabindex="-1">Elegir archivos…</button><input type="file" id="fxFile" multiple accept=".json,.glsl,.frag,.txt,application/json,text/plain" title="Elegir archivos"></span></div>
    <textarea class="code" id="fxPaste" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="…o pega aquí el código de un efecto (por ejemplo, el que te dio un LLM)"></textarea>
    <button id="fxPasteBtn" class="primary">Importar código pegado</button>
    <div id="fxMsg"></div>
    <div class="sec">Instalados (<span id="fxCount">0</span>)</div>
    <div id="fxList"></div>
    <div class="fxbtns"><button id="fxExportAll">Exportar todos</button></div>
  </div>
</div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const ICON={
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
 fit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
 wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>',
 puzzle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h3a2 2 0 1 1 4 0h3v5a2 2 0 1 1 0 4v6h-5a2 2 0 1 0-4 0H5v-5a2 2 0 1 0 0-4V4z"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
 edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>'
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CH=['Luminancia','R','G','B','Alfa'];
const CATS={src:'Fuentes',flt:'Filtros',attr:'Atributos',mix:'Combinar',code:'Código',fx:'Mis efectos'};

/* ---------------- WebGL ---------------- */
const canvas=$('#gl');
const gl=canvas.getContext('webgl2',{antialias:false,premultipliedAlpha:false,alpha:false});
if(!gl){document.body.innerHTML='<div class="fatal">Este navegador no tiene WebGL2. Prueba con Chrome, Edge, Firefox o Safari 15+.</div>';return;}
let floatOK=!!gl.getExtension('EXT_color_buffer_float');
const RES=[[960,540,'960×540'],[1280,720,'1280×720'],[540,960,'540×960 vertical'],[1080,1080,'1080×1080']];
let resIdx=0,W=960,H=540,T=0;
gl.bindVertexArray(gl.createVertexArray());

const VS=`#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const VSH=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(VSH,VS);gl.compileShader(VSH);

const FS_HEAD=`#version 300 es
precision highp float;
precision highp int;
in vec2 vUv;
out vec4 outColor;
uniform vec2 uRes;
uniform float uTime;
uniform sampler2D iA;
uniform sampler2D iB;
uniform sampler2D iC;
uniform int uChA;
uniform int uChB;
uniform int uChC;
uniform float uHasA;
uniform float uHasB;
uniform float uHasC;
float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
float pick(vec4 c,int ch){if(ch==0)return luma(c.rgb);if(ch==1)return c.r;if(ch==2)return c.g;if(ch==3)return c.b;return c.a;}
vec4 A(vec2 p){return texture(iA,p);}
vec4 B(vec2 p){return texture(iB,p);}
vec4 C(vec2 p){return texture(iC,p);}

  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){r.err=gl.getShaderInfoLog(s)||'Error de compilación';gl.deleteShader(s);progs.set(fs,r);return r;}
  const p=gl.createProgram();gl.attachShader(p,VSH);gl.attachShader(p,s);gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){r.err=gl.getProgramInfoLog(p)||'Error de enlace';progs.set(fs,r);return r;}
  r.p=p;r.loc={};progs.set(fs,r);return r;

function patternCanvas(){

  let gr=g.createLinearGradient(0,0,0,720);gr.addColorStop(0,'#14204a');gr.addColorStop(.55,'#c4507a');gr.addColorStop(1,'#f6b26b');
  g.fillStyle=gr;g.fillRect(0,0,1280,720);

  g.fillStyle=gr;g.beginPath();g.arc(880,390,200,0,7);g.fill();
  const mt=(col,pts)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,720);pts.forEach(([x,y])=>g.lineTo(x,y));g.lineTo(1280,720);g.closePath();g.fill();};
  mt('#3a1f4f',[[0,470],[160,380],[300,450],[470,330],[640,440],[800,370],[980,460],[1130,390],[1280,450]]);
  mt('#1b1230',[[0,580],[200,500],[380,570],[560,515],[760,600],[960,530],[1140,590],[1280,550]]);

  for(let i=0;i<9;i++){const y=630+i*i*1.6;g.beginPath();g.moveTo(0,y);g.lineTo(1280,y);g.stroke();}
  for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(640+i*30,630);g.lineTo(640+i*170,720);g.stroke();}
  g.fillStyle='rgba(255,255,255,.93)';g.font='800 150px Inter, Helvetica, Arial, sans-serif';g.fillText('AGNES',90,250);
  g.fillStyle='rgba(255,255,255,.72)';g.font='500 34px Inter, Helvetica, Arial, sans-serif';g.fillText('capa → atributo → capa',96,305);
  g.fillStyle='rgba(255,255,255,.6)';

  return c;
}

const FFTN=2048,HOP=1024,BANDS=['Volumen','Graves','Medios','Agudos'];

/* ---- Lenguaje de snippets: GLSL con @atributos ---- */
/* Separa definiciones de función (y #define) de nivel superior del resto del código */
const FN_RE=/^[ \t]*(?:(?:highp|mediump|lowp|const)\s+)*(?:void|float|int|uint|bool|[biu]?vec[234]|mat[234](?:x[234])?)\s+[A-Za-z_]\w*\s*\(/;

  if(src[i]==='/'&&src[i+1]==='*'){const j=src.indexOf('*/',i+2);i=j<0?src.length:j+2;continue;}return i;}}

    if(c==='/'&&src[i+1]==='/'){const j=src.indexOf('\n',i);if(j<0)return -1;i=j;continue;}

/* ---------------- Mis efectos: biblioteca guardada en el navegador ---------------- */
const FXKEY='agnes-effects-v1';let FX=[];
const fxGet=id=>FX.find(e=>e.id===id);
function parseMeta(code){
  const g=re=>{const m=code.match(re);return m?m[1].trim():'';};
  const inputs=[];const re=/^[ \t]*#input[ \t]+([ABC])\b[ \t]*(.*)$/gm;let m;
  while((m=re.exec(code))){let label=m[2].trim(),scalar=false;
    if(/\s*\bscalar$/i.test(label)){scalar=true;label=label.replace(/\s*\bscalar$/i,'').trim();}
    if(!inputs.some(i=>i.k===m[1]))inputs.push({k:m[1],label:label||m[1],scalar});}
  return{name:g(/^[ \t]*#effect[ \t]+(.+)$/m),desc:g(/^[ \t]*#desc[ \t]+(.+)$/m),inputs};
}
function fxInputs(code){
  const meta=parseMeta(code);let ins=meta.inputs;
  if(!ins.length)ins=['A','B','C'].filter(L=>new RegExp('@'+L+'v?\\b|\\b'+L+'\\s*\\(').test(code)).map(L=>({k:L,label:L,scalar:false}));
  return ins.sort((a,b)=>a.k<b.k?-1:1).map(i=>({k:i.k,label:i.label,slot:'ABC'.indexOf(i.k),kind:i.scalar?'scalar':'rgba',white:i.scalar}));
}
function registerFX(e){
  DEFS['fx:'+e.id]={name:e.name,cat:'fx',desc:e.desc||'',fx:e.id,inputs:fxInputs(e.code),params:[],
    td:n=>/@time/.test(codeOf(n)),run:runSnippet};
}
function saveFX(){try{localStorage.setItem(FXKEY,JSON.stringify(FX));return true;}catch(_){toast('No se pudo guardar en el navegador (almacenamiento lleno o bloqueado)');return false;}}
function loadFX(){try{const a=JSON.parse(localStorage.getItem(FXKEY)||'[]');FX=Array.isArray(a)?a.filter(e=>e&&typeof e.id==='string'&&typeof e.code==='string'&&e.name):[];}catch(_){FX=[];}
  FX.forEach(registerFX);}
function fxRefreshNodes(id){const t='fx:'+id,d=DEFS[t];
  nodes.forEach(n=>{if(n.type!==t)return;n._code=null;
    for(const k in n.inputs)if(!d.inputs.some(i=>i.k===k))delete n.inputs[k];invalidate(n);});}
/* Crea o actualiza (por nombre, sin distinguir mayúsculas). Devuelve {e, updated} */
function upsertFX(name,desc,code){
  name=String(name).trim().slice(0,60)||'Efecto sin nombre';desc=String(desc||'').trim().slice(0,140);
  let e=FX.find(x=>x.name.toLowerCase()===name.toLowerCase()),updated=!!e;
  if(e){e.name=name;e.desc=desc||e.desc;e.code=code;e.updated=Date.now();}
  else{e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,desc,code,created:Date.now()};FX.push(e);}
  registerFX(e);if(updated)fxRefreshNodes(e.id);return{e,updated};
}
function deleteFX(id){const e=fxGet(id);if(!e)return;const t='fx:'+id;
  /* los nodos que lo usan se convierten en nodos Código con el mismo código, para no romper el grafo */
  nodes.forEach(n=>{if(n.type!==t)return;n.type='snippet';n.p.code=e.code;n._code=null;invalidate(n);});
  FX=FX.filter(x=>x!==e);delete DEFS[t];saveFX();buildMenu();renderGraph();renderParams();scheduleSave();renderFxList();}
function stripFences(c){const m=String(c).match(/```[\w-]*[ \t]*\r?\n([\s\S]*?)```/);return(m?m[1]:String(c)).replace(/\r\n?/g,'\n').replace(/^﻿/,'');}
function parseImport(text,filename){
  const t=String(text).replace(/^﻿/,'').trim();let raw=[];
  if(t[0]==='{'||t[0]==='['){let j;try{j=JSON.parse(t);}catch(err){throw new Error('JSON inválido: '+err.message);}
    const arr=Array.isArray(j)?j:Array.isArray(j.effects)?j.effects:[j];
    arr.forEach((o,i)=>{if(!o||typeof o.code!=='string')throw new Error(`El efecto ${i+1} no tiene el campo "code"`);raw.push(o);});}
  else raw.push({code:t});
  const base=(filename||'').replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').trim();
  return raw.map(o=>{const code=stripFences(o.code).trim()+'\n';const m=parseMeta(code);
    return{name:o.name||m.name||(raw.length===1?base:'')||'Efecto sin nombre',desc:o.desc||m.desc||'',code};});

function importText(text,filename){
  const out={ok:[],upd:[],bad:[]};let items;
  try{items=parseImport(text,filename);}catch(err){out.bad.push(`${filename||'Texto pegado'}: ${err.message}`);return out;}
  for(const it of items){
    if(it.code.length>65536){out.bad.push(`${it.name}: el código es demasiado largo (máx. 64 KB)`);continue;}
    const r=compile(buildSnippet(it.code).fs);
    if(r.err){out.bad.push(`${it.name}: ${fmtErr(r.err)}`);continue;}
    const{e,updated}=upsertFX(it.name,it.desc,it.code);(updated?out.upd:out.ok).push(e.name);}
  return out;
}
function reportImport(results){
  const ok=results.flatMap(r=>r.ok),upd=results.flatMap(r=>r.upd||[]),bad=results.flatMap(r=>r.bad);
  if(ok.length||upd.length){saveFX();buildMenu();renderGraph();renderParams();scheduleSave();}
  renderFxList();
  const m=$('#fxMsg');m.innerHTML=(ok.length?`<div class="good">✓ ${ok.length===1?'Importado':'Importados'}: ${ok.map(esc).join(', ')}</div>`:'')+
    (upd.length?`<div class="good">↻ ${upd.length===1?'Actualizado':'Actualizados'}: ${upd.map(esc).join(', ')}</div>`:'')+
    (bad.length?`<div class="bad">No se importó:\n${bad.map(esc).join('\n')}</div>`:'');
}
function fxToJSON(list){const one=e=>({name:e.name,desc:e.desc||'',code:e.code});
  return JSON.stringify(list.length===1?Object.assign({agnes:'effect',version:1},one(list[0])):{agnes:'effects',version:1,effects:list.map(one)},null,2);}
function slug(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'efecto';}
async function saveTextFile(text,name){
  const blob=new Blob([text],{type:'application/json'});
  if(dl){try{await dl.save({filename:name,data:blob});return 'Guardado: '+name;}catch(err){if(err&&err.code==='declined')return 'Guardado cancelado.';}}
  if(!window.claude){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return 'Descargado: '+name;}catch(_){}}

}

      <button data-fx="add" title="Agregar al grafo">${ICON.plus}</button><button class="icon" data-fx="edit" title="Abrir el código en un nodo Código">${ICON.edit}</button>

}
function openFx(){closeMenu();$('#fxMsg').innerHTML='';renderFxList();$('#fxDlg').hidden=false;}

function renderGraph(){

function refreshClasses(){for(const id in nodeEls){nodeEls[id].classList.toggle('sel',id===selId);nodeEls[id].classList.toggle('disp',id===displayId);}}
function rel(el,root){let x=0,y=0;while(el&&el!==root){x+=el.offsetLeft;y+=el.offsetTop;el=el.offsetParent;}return[x,y];}
function anchor(n,sel){const el=nodeEls[n.id];const i=el&&el.querySelector(sel);if(!i)return[n.x,n.y];const[x,y]=rel(i,el);return[n.x+x+i.offsetWidth/2,n.y+y+i.offsetHeight/2];}

function curve(a,b){const dx=Math.max(30,Math.abs(b[0]-a[0])*.5);return`M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;}
function drawWires(){let s='';
  for(const n of nodes)for(const i of DEFS[n.type].inputs){const src=byId(n.inputs[i.k]);if(!src)continue;
    s+=`<path class="${i.kind==='scalar'?'sc':''}" d="${curve(outAnchor(src),inAnchor(n,i.k))}"/>`;}
  for(const n of nodes){if(!n.mod)continue;const seen=new Set();
    for(const k in n.mod){const a=byId(n.mod[k].src);if(!a||seen.has(a.id))continue;seen.add(a.id);s+=`<path class="mod" d="${curve(outAnchor(a),[n.x,n.y+15])}"/>`;}}

function fitView(){
  if(!nodes.length)return;const r=graphEl.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

  const pad=26,bottom=48;const s=clamp(Math.min((r.width-pad*2)/(x1-x0),(r.height-pad-bottom)/(y1-y0)),.3,1.1);
  view.s=s;view.x=(r.width-(x1-x0)*s)/2-x0*s;view.y=pad*.6+((r.height-pad-bottom)-(y1-y0)*s)/2-y0*s;applyView();}
let toastT;

/* Puntero: mover, conectar, pan, pellizco */
const ptrs=new Map();let drag=null;
function startPinch(){const[p,q]=[...ptrs.values()];const r=graphEl.getBoundingClientRect();const mx=(p.x+q.x)/2-r.left,my=(p.y+q.y)/2-r.top;
  drag={type:'pinch',d0:Math.hypot(p.x-q.x,p.y-q.y)||1,s0:view.s,wx:(mx-view.x)/view.s,wy:(my-view.y)/view.s};}

  const mx=(p.x+q.x)/2-r.left,my=(p.y+q.y)/2-r.top;const s=clamp(drag.s0*Math.hypot(p.x-q.x,p.y-q.y)/drag.d0,.25,2.5);

graphEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('#menu,.fab,.eye'))return;

  if(outP&&nodeEl){drag={type:'wire',from:nodeEl.dataset.id};tmpWire={a:outAnchor(byId(drag.from)),b:toWorld(e.clientX,e.clientY)};graphEl.classList.add('wiring');drawWires();}
  else if(inP&&nodeEl){const n=byId(nodeEl.dataset.id),k=inP.dataset.k;
    if(n.inputs[k]&&byId(n.inputs[k])){const from=n.inputs[k];delete n.inputs[k];invalidate(n);drag={type:'wire',from,restore:{id:n.id,k},sx:e.clientX,sy:e.clientY};tmpWire={a:outAnchor(byId(from)),b:toWorld(e.clientX,e.clientY)};}
    else{drag={type:'rev',to:n.id,k,sx:e.clientX,sy:e.clientY};tmpWire={a:toWorld(e.clientX,e.clientY),b:inAnchor(n,k)};}
    graphEl.classList.add('wiring');drawWires();}
  else if(nodeEl){const n=byId(nodeEl.dataset.id);if(selId!==n.id)select(n.id);drag={type:'move',n,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y};}
  else drag={type:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false};

    const el=nodeEls[n.id];el.style.left=n.x+'px';el.style.top=n.y+'px';drawWires();drag.moved=true;}
  else if(drag.type==='pan'){view.x=drag.ox+e.clientX-drag.sx;view.y=drag.oy+e.clientY-drag.sy;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>5)drag.moved=true;applyView();}
  else{if(drag.sx!==undefined&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6)drag.moved=true;
    if(drag.type==='wire')tmpWire.b=toWorld(e.clientX,e.clientY);else tmpWire.a=toWorld(e.clientX,e.clientY);drawWires();}
});
function endPtr(e){

    return box('moov',full('mvhd',0,0,u32(0,0,1000,movieDur),u32(0x00010000),u16(0x0100,0),u32(0,0),MATRIX,u32(0,0,0,0,0,0),u32(audio?3:2)),...tracks);};

/* Codifica el audio del nodo Audio (en bucle) para la duración exportada. AAC si se puede; si no, Opus. */
async function encodeAudioTrack(buf,dur){
  if(typeof AudioEncoder!=='function'||typeof AudioData!=='function'||typeof OfflineAudioContext!=='function')return null;
  const ch=Math.min(2,buf.numberOfChannels),sr=48000;let cfg=null;
  for(const c of[{codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:ch,bitrate:160000},{codec:'opus',sampleRate:sr,numberOfChannels:ch,bitrate:128000}]){
    try{const r=await AudioEncoder.isConfigSupported(c);if(r&&r.supported){cfg=c;break;}}catch(_){}}
  if(!cfg)return null;
  const len=Math.max(1,Math.round(dur*sr)),oac=new OfflineAudioContext(ch,len,sr),src=oac.createBufferSource();
  src.buffer=buf;src.loop=true;src.connect(oac.destination);src.start(0);const out=await oac.startRendering();
  const isAac=cfg.codec!=='opus',chunks=[];let desc=null,err=null;
  const enc=new AudioEncoder({output:(c,meta)=>{const d=meta&&meta.decoderConfig&&meta.decoderConfig.description;
      if(d&&!desc)desc=d instanceof ArrayBuffer?new Uint8Array(d.slice(0)):new Uint8Array(d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength));
      const b=new Uint8Array(c.byteLength);c.copyTo(b);chunks.push({data:b,samples:c.duration?Math.round(c.duration*sr/1e6):(isAac?1024:960)});},
    error:e=>{err=e;}});
  try{enc.configure(cfg);}catch(_){return null;}
  const planes=[...Array(ch)].map((_,c)=>out.getChannelData(c)),F=1024;
  for(let i=0;i<len;i+=F){if(exporting&&exporting.cancel)break;const nf=Math.min(F,len-i),data=new Float32Array(nf*ch);
    for(let c=0;c<ch;c++)data.set(planes[c].subarray(i,i+nf),c*nf);
    const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:nf,numberOfChannels:ch,timestamp:Math.round(i*1e6/sr),data});
    enc.encode(ad);ad.close();while(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,2));}
  try{await enc.flush();}catch(e){err=err||e;}try{enc.close();}catch(_){}
  if(err||!chunks.length)return null;
  if(isAac){if(isAac&&chunks.every(c=>c.samples===0))chunks.forEach(c=>c.samples=1024);
    /* AudioSpecificConfig: AAC-LC, 48 kHz (índice 3), canales */
    if(!desc||!desc.length)desc=u8(0x11,0x80|(ch<<3));return{codec:'aac',sr,ch,desc,chunks,bitrate:cfg.bitrate};}
  let preskip=312;if(desc&&desc.length>=12&&String.fromCharCode(...desc.slice(0,8))==='OpusHead')preskip=desc[10]|(desc[11]<<8);

}
async function seekVideos(t,fps){
  const vs=nodes.filter(n=>n._video&&n._video.readyState>=1);
  await Promise.all(vs.map(n=>new Promise(res=>{
    const v=n._video,d=v.duration||1;
    /* centro del cuadro: evita caer justo en el borde entre dos cuadros */
    const tt=Math.min((t+.5/fps)%d,Math.max(0,d-.5/fps));
    let done=false,seeked=false,framed=typeof v.requestVideoFrameCallback!=='function';
    const fin=()=>{if(!done){done=true;clearTimeout(to);res();}};
    const to=setTimeout(fin,4000);
    if(!framed)v.requestVideoFrameCallback(()=>{framed=true;if(seeked)fin();});
    v.addEventListener('seeked',()=>{seeked=true;if(framed)fin();else setTimeout(fin,600);},{once:true});
    v.currentTime=tt;})));
  vs.forEach(n=>{n._valid=false;});
}
async function renderOffline(){
  const d=byId(displayId);if(!d){expMsg.textContent='No hay ningún nodo en el visor.';return;}
  const fps=+$('#expFps').value||30,dur=+expDur.value||5,N=Math.max(1,Math.round(dur*fps));
  const base={width:W,height:H,bitrate:Math.round(W*H*fps*.16),framerate:fps,avc:{format:'avc'},latencyMode:'quality'};
  let cfg=null;
  for(const codec of['avc1.42002A','avc1.420028','avc1.42001F','avc1.4D0028','avc1.640028']){
    const c={...base,codec};if(codec[5]!=='4'||codec[6]!=='2')c.latencyMode='realtime';
    try{const r=await VideoEncoder.isConfigSupported(c);if(r&&r.supported){cfg=c;break;}}catch(_){}}
  if(!cfg){if(pickMime())return startRec();expMsg.textContent='Este navegador no puede crear video.';return;}
  const samples=[];let desc=null,encErr=null;
  const enc=new VideoEncoder({output:(chunk,meta)=>{
      const dc=meta&&meta.decoderConfig&&meta.decoderConfig.description;
      if(dc&&!desc)desc=dc instanceof ArrayBuffer?new Uint8Array(dc.slice(0)):new Uint8Array(dc.buffer.slice(dc.byteOffset,dc.byteOffset+dc.byteLength));
      const b=new Uint8Array(chunk.byteLength);chunk.copyTo(b);samples.push({data:b,key:chunk.type==='key'});},
    error:e=>{encErr=e;}});
  try{enc.configure(cfg);}catch(e){expMsg.textContent='No se pudo iniciar el codificador.';return;}
  const wasPlaying=playing,keepT=T,keepView=viewCh;
  exporting={cancel:false};nodes.forEach(n=>{if(n._video)n._video.pause();if(n._audio)n._audio.pause();});viewCh=0;
  expPrev.innerHTML='';expProg.hidden=false;expProg.firstElementChild.style.width='0';
  expRec.textContent='Cancelar';expRec.classList.remove('primary');
  const t0=performance.now();
  try{
    for(let i=0;i<N;i++){
      if(exporting.cancel||encErr)break;
      T=i/fps;await seekVideos(T,fps);
      const dn=byId(displayId);if(!dn)break;const tex=evalNode(dn);
      pass(EXPORT_FS,null,P=>bindTex(P,'uTex',0,tex));
      const fr=new VideoFrame(canvas,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
      enc.encode(fr,{keyFrame:i%(fps*2)===0});fr.close();
      while(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,4));
      if(i%2===0||i===N-1){expProg.firstElementChild.style.width=((i+1)/N*100)+'%';
        const el=(performance.now()-t0)/1000,eta=el/(i+1)*(N-i-1);
        expMsg.textContent=`Renderizando cuadro ${i+1} de ${N}… faltan ~${Math.ceil(eta)} s`;await new Promise(r=>setTimeout(r,0));}
    }

  try{enc.close();}catch(_){}
  const cancelled=exporting.cancel;exporting=null;
  T=keepT;viewCh=keepView;viewDirty=true;nodes.forEach(n=>{n._valid=false;});setPlaying(wasPlaying);
  expRec.textContent='Grabar video';expRec.classList.add('primary');
  if(cancelled){expMsg.textContent='Exportación cancelada.';expProg.hidden=true;return;}
  if(encErr||!desc||!samples.length){expMsg.textContent='Falló la codificación'+(encErr?': '+(encErr.message||encErr):'')+'.';return;}
  let audio=null;const an=nodes.find(x=>x.type==='audio'&&x._abuf);
  if(an){expMsg.textContent='Codificando el audio…';exporting={cancel:false};
    try{audio=await encodeAudioTrack(an._abuf,N/fps);}catch(_){audio=null;}
    const c=exporting.cancel;exporting=null;if(c){expMsg.textContent='Exportación cancelada.';expProg.hidden=true;return;}}

  offer(buildMP4(W,H,fps,desc,samples,audio),`agnes-${stamp()}.mp4`,'vid');
  if(an&&!audio)setTimeout(()=>{expMsg.textContent+=' (Este navegador no pudo codificar el audio; el video va sin sonido.)';},50);

const EXPORT_FS=`#version 300 es
precision highp float;in vec2 vUv;out vec4 outColor;uniform sampler2D uTex;
void main(){outColor=clamp(texture(uTex,vUv),0.,1.);}`;
async function getDownloads(){for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,250));
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(_){dl=null;}}
function pickMime(){if(!window.MediaRecorder)return null;
  for(const [m,ext] of [['video/mp4;codecs=avc1.42E01E','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9','webm'],['video/webm;codecs=vp8','webm'],['video/webm','webm']])

const expEl=$('#exp'),expMsg=$('#expMsg'),expPrev=$('#expPrev'),expProg=expEl.querySelector('.prog'),expRec=$('#expRec'),expDur=$('#expDur');
function stamp(){const d=new Date(),z=v=>String(v).padStart(2,'0');return`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;}
function openExport(){
  const mm=pickMime();const vids=nodes.filter(n=>n._video&&isFinite(n._video.duration));
  $('#expPhotoNote').textContent=`Fotograma actual del nodo que está en el visor, a ${W}×${H}.`;
  const hasAud=nodes.some(x=>x.type==='audio'&&x._abuf);
  $('#expVidNote').textContent=hasWC?`Se renderiza cuadro por cuadro desde 0 s, a ${W}×${H}, en MP4. Sale fluido aunque tarde más que la duración. ${hasAud?'Incluye el audio del nodo Audio.':'Sin audio (agrega un nodo Audio para incluirlo).'}`:
    mm?`Se graba en tiempo real desde 0 s, a ${W}×${H}, en ${mm.ext.toUpperCase()}. Sin audio. Deja la pantalla encendida mientras graba.`:'Este navegador no puede grabar video.';
  let opts=[2,5,10,15,30].map(v=>`<option value="${v}">${v} s</option>`).join('');
  if(vids.length){const dv=Math.max(...vids.map(n=>n._video.duration));opts=`<option value="${dv}">Duración del video (${dv.toFixed(1)} s)</option>`+opts;}
  const auds=nodes.filter(n=>n.type==='audio'&&n._abuf);
  if(auds.length){const da=auds[0]._abuf.duration;opts=`<option value="${da}">Duración del audio (${da.toFixed(1)} s)</option>`+opts;}
  expDur.innerHTML=opts;if(!vids.length&&!auds.length)expDur.value='5';
  expRec.disabled=!mm&&!hasWC;expMsg.textContent='';expPrev.innerHTML='';expProg.hidden=true;expEl.hidden=false;
}
function closeExport(){if(rec)stopRec(true);if(exporting)exporting.cancel=true;expEl.hidden=true;expPrev.innerHTML='';}

function exportPhoto(fmt){
  const d=byId(displayId);if(!d){expMsg.textContent='No hay ningún nodo en el visor.';return;}
  const tex=evalNode(d);if(!expT8||expT8.w!==W||expT8.h!==H){freeTarget(expT8);expT8=makeTarget8();}
  pass(EXPORT_FS,expT8,P=>bindTex(P,'uTex',0,tex));
  const px=new Uint8Array(W*H*4);gl.bindFramebuffer(gl.FRAMEBUFFER,expT8.fb);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');const img=ctx.createImageData(W,H);
  for(let y=0;y<H;y++)img.data.set(px.subarray((H-1-y)*W*4,(H-y)*W*4),y*W*4);
  ctx.putImageData(img,0,0);let out=c;

async function offer(blob,name,kind){
  const mb=(blob.size/1048576).toFixed(1);
  if(dl){expMsg.textContent=`Listo (${mb} MB). Confirma para guardar…`;
    try{await dl.save({filename:name,data:blob});expMsg.textContent=`✓ Guardado: ${name}`;return;}
    catch(err){const c=err&&err.code;
      if(c==='declined'){expMsg.textContent='Guardado cancelado.';showPrev(blob,kind,name);return;}
      if(c==='rate_limited'){expMsg.textContent='Ya hay una confirmación abierta; inténtalo en un momento.';return;}
      if(c==='too_large'){expMsg.textContent='El archivo es demasiado grande. Prueba con menos duración o un lienzo más chico.';return;}}}
  if(!window.claude){/* fuera de claude.ai (p. ej. GitHub Pages) la descarga normal sí funciona */
    try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      expMsg.textContent=`✓ Descargado: ${name} (${mb} MB)`;showPrev(blob,kind,name);return;}catch(_){}}
  expMsg.textContent=`Listo (${mb} MB). Aquí no se puede descargar directo: mantén presionado el resultado para guardarlo, o abre la página en el navegador.`;
  showPrev(blob,kind,name);
}
function showPrev(blob,kind,name){const url=URL.createObjectURL(blob);

let savedView=null;

  const mm=pickMime(),d=byId(displayId);if(!mm||!d){expMsg.textContent=d?'Este navegador no puede grabar video.':'No hay ningún nodo en el visor.';return;}
  const dur=+expDur.value||5;let stream;
  try{stream=canvas.captureStream(30);}catch(_){expMsg.textContent='No se pudo capturar el visor.';return;}
  let mr;try{mr=new MediaRecorder(stream,{mimeType:mm.m,videoBitsPerSecond:Math.round(W*H*30*0.2)});}catch(_){mr=new MediaRecorder(stream);}
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec={mr,dur,mm,chunks,cancel:false};savedView=viewCh;viewCh=0;$('#vch').value='0';
  T=0;nodes.forEach(n=>{if(n._video){n._video.currentTime=0;}});setPlaying(true);viewDirty=true;

  expRec.textContent='Cancelar';expRec.classList.remove('primary');expMsg.textContent='Grabando…';
}
function recTick(){const k=clamp(T/rec.dur,0,1);expProg.firstElementChild.style.width=(k*100)+'%';
  expMsg.textContent=`Grabando… ${T.toFixed(1)} / ${rec.dur.toFixed(1)} s`;
  if(T>=rec.dur&&rec.mr.state==='recording')stopRec(false);}

function initExport(){

  $('#exportBtn').onclick=openExport;$('#expClose').onclick=closeExport;
  expEl.addEventListener('click',e=>{if(e.target===expEl&&!rec)closeExport();const b=e.target.closest('[data-photo]');if(b)exportPhoto(b.dataset.photo);});
  expRec.onclick=()=>{if(exporting){exporting.cancel=true;return;}if(rec)stopRec(true);else if(hasWC)renderOffline();else startRec();};
  getDownloads();
}
